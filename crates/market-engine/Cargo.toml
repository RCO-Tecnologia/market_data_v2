[package]
name = "market-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "In-memory state engines for Cedro market data: quotes, books, trades."

[dependencies]
cedro-protocol = { path = "../cedro-protocol" }

bytes.workspace = true
dashmap.workspace = true
ahash.workspace = true
indexmap = "2.7"
crossbeam-channel.workspace = true
thiserror.workspace = true
metrics.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion = { workspace = true }

[[bench]]
name = "engine_throughput"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
option_if_let_else = "allow"
needless_pass_by_value = "allow"
collapsible_if = "allow"
# DashMap entries return guards that hold a shard lock; clippy's
# `significant_drop_tightening` lint fights with the entry API idiom.
significant_drop_tightening = "allow"
