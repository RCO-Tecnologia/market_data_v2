[package]
name = "cedro-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure parsing of the Cedro Crystal socket protocol. No I/O, no async — testable in isolation."

[dependencies]
bytes.workspace = true
memchr.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
# Enable serde derives on protocol types — useful for downstream crates
# that publish these structures over NATS or HTTP.
serde = ["dep:serde"]

[dev-dependencies]
proptest.workspace = true
criterion = { workspace = true }

[[bench]]
name = "parser_throughput"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# These pedantic lints are too noisy for a parser-heavy crate.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
