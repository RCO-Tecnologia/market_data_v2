# NATS configuration for market_data_v2.
# Reference: https://docs.nats.io/running-a-nats-service/configuration

# Client port — ingest-daemon and api-server both connect here.
port: 4222

# Monitoring endpoint (healthcheck uses /varz).
http_port: 8222

# Server name shows up in monitoring.
server_name: market-data-nats

# Generous limits — the engine can publish bursts of tens of thousands of
# messages per second on hot tickers.
max_payload: 4MB
max_pending: 256MB
max_connections: 4096

# Logging
debug: false
trace: false
logtime: true

# JetStream — required for the "stream" semantics ARCHITECTURE §5.6 calls
# for (snapshot replay on api-server reconnect). Retention is short because
# we are not the source of truth.
jetstream {
    store_dir: /data
    max_memory_store: 1GB
    max_file_store: 8GB
}
