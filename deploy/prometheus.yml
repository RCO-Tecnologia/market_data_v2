# Prometheus scrape config for market_data_v2.
# Point your existing Prometheus at these targets, or run a sidecar
# Prometheus that includes this file.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: market_data_v2

scrape_configs:
  - job_name: ingest-daemon
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          service: ingest-daemon

  - job_name: api-server
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9101"]
        labels:
          service: api-server

  - job_name: nats
    metrics_path: /varz
    static_configs:
      - targets: ["localhost:8222"]
        labels:
          service: nats
