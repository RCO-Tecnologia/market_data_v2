[package]
name = "ingest-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Binary entry point: wires every crate together into a running Cedro ingestion daemon."

[[bin]]
name = "ingest-daemon"
path = "src/main.rs"

[dependencies]
cedro-protocol = { path = "../../crates/cedro-protocol" }
cedro-client = { path = "../../crates/cedro-client" }
market-engine = { path = "../../crates/market-engine" }
fanout = { path = "../../crates/fanout" }
raw-archive = { path = "../../crates/raw-archive" }
persistence = { path = "../../crates/persistence" }
observability = { path = "../../crates/observability" }

tokio.workspace = true
crossbeam-channel.workspace = true
bytes.workspace = true
chrono.workspace = true
ahash.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
metrics.workspace = true
tikv-jemallocator.workspace = true

[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
needless_pass_by_value = "allow"
doc_markdown = "allow"
option_if_let_else = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
let_underscore_future = "allow"
significant_drop_tightening = "allow"
